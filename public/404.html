<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Opening Robert's Recipe Box</title>
  </head>
  <body>
    <p>Opening Robert's Recipe Box…</p>
    <script>
      (function () {
        var route = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?route=' + encodeURIComponent(route));
      }());
    </script>
  </body>
</html>
